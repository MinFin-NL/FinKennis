[project]
name = "finkennis"
version = "0.1.0"
description = "Kennisbanken met documenten en een AI-chat erover (RAG)"
readme = "../README.md"
license = "EUPL-1.2"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "python-multipart>=0.0.18",
    "pyjwt[crypto]>=2.10",
    "docling>=2.15",
    "pydantic-ai-slim[openai]>=2.63.0",
    # Via docling; hier genoemd zodat [tool.uv.sources] de CPU-build kan kiezen.
    "torch",
    "torchvision",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

# Container Apps heeft geen GPU: op Linux de CPU-build van torch, anders haalt docling
# gigabytes aan CUDA-bibliotheken het image in.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
