services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: finkennis
      POSTGRES_PASSWORD: finkennis
      POSTGRES_DB: finkennis
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finkennis"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["auth"]
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak/finkennis-realm.json:/opt/keycloak/data/import/finkennis-realm.json:ro

volumes:
  pgdata:
