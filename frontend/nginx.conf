server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Moet boven MAX_UPLOAD_MB van de backend liggen (50), anders weigert nginx eerst.
        client_max_body_size 60m;
        proxy_pass ${BACKEND_URL}/api/;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Het antwoord komt als server-sent events: niet bufferen, en het taalmodel
        # mag even nadenken.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    # Alles onder /assets/ heeft een hash in de bestandsnaam: mag eeuwig in de cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA-fallback. index.html verwijst naar de gehashte bundels en mag dus nooit
    # verouderd uit een cache komen.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
